services:
  postgres:
    image: postgres:16
    container_name: festival-postgres
    environment:
      POSTGRES_DB: festival
      POSTGRES_USER: festival
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - festival-postgres-data:/var/lib/postgresql/data

volumes:
  festival-postgres-data:
