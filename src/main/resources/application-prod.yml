# 배포(EC2) 환경. 값은 전부 환경변수로 주입한다 (docker-compose.prod.yml 의 env_file 참고).
# 이 파일 자체에는 비밀값을 직접 적지 않는다.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:wks}
    username: ${DB_USERNAME:wks}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

