spring:
  application:
    name: wks
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  datasource:
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # nginx 가 HTTPS 를 끊고 앱에는 http 로 넘기므로, X-Forwarded-Proto 를 안 믿으면 앱이 자기 주소를 http:// 로 안다
  # (Swagger 서버 URL 이 http 로 나와 "Try it out" 이 막혔다). native = Tomcat RemoteIpValve 라 사설망(도커 네트워크)
  # 프록시가 보낸 헤더만 믿는다 — 외부에서 8080 으로 직접 온 요청의 위조 헤더는 무시된다
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false

logging:
  pattern:
    # 에러 응답의 traceId(TraceIdFilter)로 그 요청의 로그만 골라낼 수 있게 레벨 옆에 붙인다
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

gemini:
  timeout-seconds: 30
  # 호출 총량 상한 (#64). 무료 한도 실측(90 RPM·2,000 RPD 이상 통과)의 안전값. AI Studio 한도 확인 후 조정
  max-per-minute: ${GEMINI_MAX_PER_MINUTE:60}
  max-per-day: ${GEMINI_MAX_PER_DAY:1600}

app:
  mail:
    from: ${MAIL_FROM:noreply@wks.local}
    # 기본 계정(spring.mail.*) 실패 시 전환할 보조 계정. 호스트·포트는 기본 계정과 같다 (common/mail/MailConfig)
    secondary:
      username: ${MAIL_SECONDARY_USERNAME:}
      password: ${MAIL_SECONDARY_PASSWORD:}
      from: ${MAIL_SECONDARY_FROM:}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  frontend:
    verify-redirect-url: ${VERIFY_REDIRECT_URL:http://localhost:3000/verify}
    dating-verify-redirect-url: ${DATING_VERIFY_REDIRECT_URL:http://localhost:3000/dating/verify}
    # 재신청 초대 메일이 가리키는 프론트 페이지. 백엔드를 거치지 않는다 — 토큰은 클릭 시점에 소비되지 않는다
    reapply-url: ${REAPPLY_URL:http://localhost:3000/dating/reapply}
  partner:
    # 제휴처 유입 보상. "코드:금액:표시이름" 을 콤마로 나열. 계정당 코드별 1회 (wallet/PartnerRewardService)
    rewards: ${PARTNER_REWARDS:FESTIVAL:10:동국대 축제}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  signup:
    email-verification-ttl-minutes: 30
    allowed-email-domains: ${SIGNUP_ALLOWED_EMAIL_DOMAINS:}
    # 기존 사전신청자 재신청 초대. 축제 전에 한 번 쓰고 버리는 값들이다
    reapply-invite-ttl-hours: ${REAPPLY_INVITE_TTL_HOURS:48}
    reapply-campaign:
      # off | dry-run(대상 수만 로그) | send(실제 발송). 켠 채로 두면 재기동마다 돈다 — 쓰고 나면 off 로 되돌린다
      mode: ${REAPPLY_CAMPAIGN_MODE:off}
  dating:
    email-verification-ttl-minutes: 30
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      photo-prefix: signup-photos/
      presigned-url-ttl-minutes: 10
  auth:
    # 값이 비어 있으면 로그인만 비활성(KAKAO_UNAVAILABLE)이고 나머지 서비스는 정상 기동한다 (AuthProperties 참고).
    allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:}
    # 로컬(plain HTTP)만 false로 덮어쓴다 (application-local.yml.example 참고).
    cookie-secure: ${COOKIE_SECURE:true}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    jwt:
      secret: ${JWT_SECRET:}
      ttl-days: 15
