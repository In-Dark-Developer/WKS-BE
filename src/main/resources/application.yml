spring:
  application:
    name: wks
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  datasource:
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

gemini:
  timeout-seconds: 30
  # 호출 총량 상한 (#64). 무료 한도 실측(90 RPM·2,000 RPD 이상 통과)의 안전값. AI Studio 한도 확인 후 조정
  max-per-minute: ${GEMINI_MAX_PER_MINUTE:60}
  max-per-day: ${GEMINI_MAX_PER_DAY:1600}

app:
  mail:
    from: ${MAIL_FROM:noreply@wks.local}
  backend:
    base-url: ${BACKEND_BASE_URL:http://localhost:8080}
  frontend:
    verify-redirect-url: ${VERIFY_REDIRECT_URL:http://localhost:3000/verify}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  signup:
    email-verification-ttl-minutes: 30
    allowed-email-domains: ${SIGNUP_ALLOWED_EMAIL_DOMAINS:}
