# api-dev.threadoffate.site → wks-app-dev. 인증서 발급 후에만 적용한다
# (docs/runbook-dev-server.md 7단계). 그 전까지는 api-dev.bootstrap.conf 를 쓴다.
#
# 기존 api.threadoffate.site 블록(default.conf)은 건드리지 않는다. 같은 nginx 컨테이너 안에서
# server_name 으로 나뉘는 별도 블록이다.

server {
    listen 80;
    server_name api-dev.threadoffate.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-dev.threadoffate.site;

    ssl_certificate /etc/letsencrypt/live/api-dev.threadoffate.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.threadoffate.site/privkey.pem;

    # 업스트림 이름을 기동 시점이 아니라 요청 시점에 찾게 한다. proxy_pass 에 호스트를 직접 적으면
    # nginx 가 뜰 때 wks-app-dev 를 resolve 하는데, 그 순간 dev 컨테이너가 없으면(배포 중·다운·재부팅 직후)
    # 이 nginx 전체가 기동 실패해 운영 api 까지 같이 죽는다. 127.0.0.11 은 Docker 내장 DNS.
    # dev 가 없으면 이 도메인만 502 가 난다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wks_dev_upstream http://wks-app-dev:8080;

    location / {
        proxy_pass $wks_dev_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
