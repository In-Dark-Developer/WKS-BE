# api-dev.threadoffate.site → wks-app-dev. 인증서 발급 후에만 적용한다
# (docs/runbook-dev-server.md 7단계). 그 전까지는 api-dev.bootstrap.conf 를 쓴다.
#
# 기존 api.threadoffate.site 블록(default.conf)은 건드리지 않는다. 같은 nginx 컨테이너 안에서
# server_name 으로 나뉘는 별도 블록이다.

server {
    listen 80;
    server_name api-dev.threadoffate.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-dev.threadoffate.site;

    ssl_certificate /etc/letsencrypt/live/api-dev.threadoffate.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.threadoffate.site/privkey.pem;

    location / {
        proxy_pass http://wks-app-dev:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
