# 부트스트랩 전용. api-dev.threadoffate.site 인증서를 아직 발급받기 전에만 쓴다.
# 443 블록이 없다 — 인증서 파일이 없는 상태에서 443 서버 블록을 두면 nginx 가 기동에 실패하고
# 같은 nginx 컨테이너를 쓰는 운영(api.threadoffate.site)까지 같이 죽는다.
# 인증서 발급 후에는 이 파일을 api-dev.conf 로 교체한다 (docs/runbook-dev-server.md 5~7단계).

server {
    listen 80;
    server_name api-dev.threadoffate.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
