# IP당 요청 제한은 CloudFront 앞단의 WAF(rate-all: IP당 5분 6,000건)로 옮겼다(2026-09-29, #139).
# CloudFront 뒤에서는 nginx 가 보는 주소가 사용자 IP 가 아니라 CloudFront IP 라, 여기서 IP 별로 세면
# 수많은 사용자가 몇 개 IP 를 나눠 쓰는 셈이 돼 정상 요청이 429 를 받는다.

# 80: ACME challenge 갱신용 경로만 두고 나머지는 443으로 리다이렉트.
server {
    listen 80;
    server_name api.threadoffate.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.threadoffate.site;

    ssl_certificate /etc/letsencrypt/live/api.threadoffate.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.threadoffate.site/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
