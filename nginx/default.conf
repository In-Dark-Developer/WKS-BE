# 80: ACME challenge 갱신용 경로만 두고 나머지는 443으로 리다이렉트.
server {
    listen 80;
    server_name api.threadoffate.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.threadoffate.site;

    ssl_certificate /etc/letsencrypt/live/api.threadoffate.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.threadoffate.site/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
