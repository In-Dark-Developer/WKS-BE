services:
  postgres:
    image: postgres:16
    container_name: wks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wks}
      POSTGRES_USER: ${DB_USERNAME:-wks}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wks-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wks}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - wks-edge

  app:
    image: ${APP_IMAGE}
    container_name: wks-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-wks}
      DB_USERNAME: ${DB_USERNAME:-wks}
      DB_PASSWORD: ${DB_PASSWORD}
      # SES 로 바꿀 때 .env 에 적는다(email-smtp.ap-northeast-2.amazonaws.com). 기본값은 기존 Gmail.
      # 보조 계정도 같은 호스트로 접속하므로, SES 로 바꾸면 MAIL_SECONDARY_* 는 비워야 한다
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # 빠지면 발신 주소가 기본값(noreply@wks.local)이 되고, Gmail 이 계정 주소로 덮어쓰면서 발신 이름까지 사라진다
      MAIL_FROM: ${MAIL_FROM}
      # 기본 계정이 실패(하루 500통 한도 등)하면 보조 계정으로 보낸다. 비워 두면 전환 없이 기본 계정만 쓴다
      MAIL_SECONDARY_USERNAME: ${MAIL_SECONDARY_USERNAME:-}
      MAIL_SECONDARY_PASSWORD: ${MAIL_SECONDARY_PASSWORD:-}
      MAIL_SECONDARY_FROM: ${MAIL_SECONDARY_FROM:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_FREE_KEY_1: ${GEMINI_FREE_KEY_1:-}
      GEMINI_FREE_KEY_2: ${GEMINI_FREE_KEY_2:-}
      GEMINI_FREE_KEY_3: ${GEMINI_FREE_KEY_3:-}
      GEMINI_PAID_KEY: ${GEMINI_PAID_KEY:-}
      GEMINI_FREE_RPM_1: ${GEMINI_FREE_RPM_1:-15}
      GEMINI_FREE_RPM_2: ${GEMINI_FREE_RPM_2:-15}
      GEMINI_FREE_RPM_3: ${GEMINI_FREE_RPM_3:-15}
      GEMINI_FREE_RPD_1: ${GEMINI_FREE_RPD_1:-500}
      GEMINI_FREE_RPD_2: ${GEMINI_FREE_RPD_2:-500}
      GEMINI_FREE_RPD_3: ${GEMINI_FREE_RPD_3:-500}
      GEMINI_PAID_RPM: ${GEMINI_PAID_RPM:-5}
      GEMINI_PAID_RPD: ${GEMINI_PAID_RPD:-120}
      GEMINI_MAX_PER_MINUTE: ${GEMINI_MAX_PER_MINUTE:-50}
      GEMINI_MAX_PER_DAY: ${GEMINI_MAX_PER_DAY:-1600}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-12}
      GEMINI_TOTAL_TIMEOUT_SECONDS: ${GEMINI_TOTAL_TIMEOUT_SECONDS:-25}
      # 제휴처 유입 보상 "코드:금액:표시이름". 기본값을 앱과 같게 둔다 — 빈 값을 넘기면 보상이 조용히 꺼진다
      PARTNER_REWARDS: ${PARTNER_REWARDS:-FESTIVAL:10:동국대 축제}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      VERIFY_REDIRECT_URL: ${VERIFY_REDIRECT_URL}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL}
      SIGNUP_ALLOWED_EMAIL_DOMAINS: ${SIGNUP_ALLOWED_EMAIL_DOMAINS:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # 이 서비스는 env_file 을 안 쓰고 여기 적은 변수만 컨테이너에 넘긴다. 앱이 새 환경변수를 읽게 되면
      # 여기에도 추가해야 한다 — 빠뜨려도 기동은 돼서(로그인은 KAKAO_UNAVAILABLE 로만 막힘) 알아채기 어렵다.
      DATING_VERIFY_REDIRECT_URL: ${DATING_VERIFY_REDIRECT_URL}
      REAPPLY_URL: ${REAPPLY_URL}
      REAPPLY_INVITE_TTL_HOURS: ${REAPPLY_INVITE_TTL_HOURS:-48}
      REAPPLY_CAMPAIGN_MODE: ${REAPPLY_CAMPAIGN_MODE:-off}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ALLOWED_REDIRECT_URIS: ${KAKAO_ALLOWED_REDIRECT_URIS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # Metaspace 128m 은 부족하다 — 개발 서버에서 소개팅 프로필 등록 중 OutOfMemoryError: Metaspace (2026-09-26)
      JAVA_TOOL_OPTIONS: "-Xmx300m -XX:MaxMetaspaceSize=200m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    networks:
      - wks-edge

  nginx:
    image: nginx:1.27-alpine
    container_name: wks-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/api-dev.conf.active:/etc/nginx/conf.d/api-dev.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - wks-edge

  certbot:
    image: certbot/certbot
    container_name: wks-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  wks-postgres-data:
  certbot-etc:
  certbot-www:

networks:
  wks-edge:
    external: true
