services:
  postgres:
    image: postgres:16
    container_name: wks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wks}
      POSTGRES_USER: ${DB_USERNAME:-wks}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wks-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE}
    container_name: wks-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-wks}
      DB_USERNAME: ${DB_USERNAME:-wks}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      VERIFY_REDIRECT_URL: ${VERIFY_REDIRECT_URL}
      SIGNUP_ALLOWED_EMAIL_DOMAINS: ${SIGNUP_ALLOWED_EMAIL_DOMAINS:-}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: wks-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  wks-postgres-data:
