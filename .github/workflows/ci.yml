name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DB 테스트는 Testcontainers(PostgreSQL)가 러너의 Docker 데몬을 그대로 쓴다 — 별도 서비스 설정 불필요.
      # LLM·카카오·S3 같은 외부 호출은 테스트에서 목킹돼 있어야 한다 (AGENTS.md).
      - name: Build and test
        run: ./gradlew build
