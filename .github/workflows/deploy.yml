name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# 여러 명이 비슷한 시간에 push하면 배포 잡이 동시에 같은 EC2에 붙어 충돌한다 (scp/docker compose 겹침).
# 진행 중인 배포는 끝까지 두고, 새 push는 큐에서 대기시켜 순서대로 실행한다.
# (cancel-in-progress: true로 하면 docker compose up 중간에 SSH가 끊겨 EC2가 어중간한 상태로 남을 수 있어 false로 둔다)
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Compute lowercase image name
        id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ needs.vars.outputs.image }}:latest
            ${{ needs.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [vars, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx"
          target: ${{ secrets.EC2_APP_DIR }}
          strip_components: 0
          debug: true

      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_APP_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            APP_IMAGE=${{ needs.vars.outputs.image }}:${{ github.sha }} docker compose -f docker-compose.prod.yml pull app
            APP_IMAGE=${{ needs.vars.outputs.image }}:${{ github.sha }} docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml restart nginx
            # 매 배포마다 github.sha로 유니크 태그를 붙여 pull하므로, -a 없이는 이전 커밋 이미지가 태그가 남아있어 정리되지 않고 디스크를 채운다
            docker image prune -a -f
