name: Deploy to EC2 (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

# 같은 브랜치의 겹친 배포는 이전 것을 취소한다 (dev는 운영과 달리 도중에 끊겨도 재배포로 복구하면 된다).
# 운영 배포(deploy.yml)와는 별도 그룹이라 서로 대기시키지 않는다.
concurrency:
  group: deploy-ec2-dev
  cancel-in-progress: true

env:
  # 운영(/opt/wks, -p wks)과 절대 겹치지 않는 고정 경로·프로젝트 이름. 시크릿으로 두지 않는 이유는
  # 시크릿 값이 잘못 바뀌어 운영 경로를 가리키게 되는 사고를 막기 위해서다.
  DEV_APP_DIR: /opt/wks-dev
  DEV_COMPOSE_PROJECT: wks-dev

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Compute lowercase image name
        id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: vars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest 는 절대 붙이지 않는다 — 운영 이미지가 개발 빌드로 덮이는 사고를 막는다
          tags: |
            ${{ needs.vars.outputs.image }}:dev
            ${{ needs.vars.outputs.image }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [vars, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync dev compose config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.dev.yml"
          target: ${{ env.DEV_APP_DIR }}
          strip_components: 0
          debug: true

      - name: SSH and redeploy dev
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEV_APP_DIR: ${{ env.DEV_APP_DIR }}
          DEV_COMPOSE_PROJECT: ${{ env.DEV_COMPOSE_PROJECT }}
          DEV_IMAGE: ${{ needs.vars.outputs.image }}:dev-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEV_APP_DIR,DEV_COMPOSE_PROJECT,DEV_IMAGE
          script: |
            set -e
            cd "$DEV_APP_DIR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            APP_IMAGE="$DEV_IMAGE" docker compose -p "$DEV_COMPOSE_PROJECT" -f docker-compose.dev.yml pull app-dev
            APP_IMAGE="$DEV_IMAGE" docker compose -p "$DEV_COMPOSE_PROJECT" -f docker-compose.dev.yml up -d
            docker image prune -a -f

      - name: Health check api-dev
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://api-dev.threadoffate.site/api/health; then
              echo "healthy"
              exit 0
            fi
            echo "not healthy yet, retrying in 5s ($i/12)"
            sleep 5
          done
          echo "api-dev health check failed"
          exit 1
